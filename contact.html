<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Contato - PiagetTech</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark nav-brand-shadow">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <img src="assets/logo.png" alt="PiagetTech Logo" class="logo me-2" />
                <span class="brand-title">PiagetTech</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto nav-links">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">Sobre</a></li>
                    <li class="nav-item"><a class="nav-link" href="services.html">Serviços</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contact.html">Contato</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <h1 class="text-center">Fale Conosco</h1>
        <p class="text-center lead">Preencha o formulário e retornaremos em até 1 dia útil. Ou envie um e-mail para <a href="mailto:contato@piagettech.com">contato@piagettech.com</a>.</p>

        <div class="row justify-content-center">
            <div class="col-lg-6">
                <form id="contactForm" class="card p-4">
                    <div class="mb-3">
                        <label for="name" class="form-label">Nome / Empresa</label>
                        <input type="text" id="name" class="form-control" required />
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" id="email" class="form-control" required />
                    </div>

                    <div class="mb-3">
                        <label for="phone" class="form-label">Telefone (opcional)</label>
                        <input type="tel" id="phone" class="form-control" />
                    </div>

                    <div class="mb-3">
                        <label for="message" class="form-label">Mensagem</label>
                        <textarea id="message" rows="5" class="form-control" required></textarea>
                    </div>

                    <div id="formMessage" class="mb-3"></div>

                    <div class="d-flex justify-content-between align-items-center">
                        <button type="submit" class="btn btn-primary">Enviar Solicitação</button>
                        <small class="text-muted">Ou ligue: (11) 99999-9999</small>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer class="site-footer bg-dark text-white py-4">
        <div class="container text-center">
            <p class="mb-1">&copy; 2025 PiagetTech. Todos os direitos reservados.</p>
            <small>contato@piagettech.com</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/scripts.js"></script>
</body>
</html>
